[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avatar-scenario-gen"
version = "0.2.0"
description = "Generate Japanese video narration from an article URL"
requires-python = ">=3.9"
dependencies = ["trafilatura>=2,<3", "lxml_html_clean>=0.4,<1", "requests>=2.32,<3"]

[project.scripts]
scenario-gen = "scenario_gen:main"

[tool.setuptools]
py-modules = ["scenario_gen"]
